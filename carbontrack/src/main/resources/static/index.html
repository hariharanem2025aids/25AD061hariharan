<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CarbonTrack</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>🌍 CarbonTrack</h1>
    <nav>
      <button class="nav-btn active" data-tab="households">Households</button>
      <button class="nav-btn" data-tab="activities">Log Activity</button>
      <button class="nav-btn" data-tab="footprint">Footprint</button>
      <button class="nav-btn" data-tab="challenges">Challenges</button>
      <button class="nav-btn" data-tab="participation">Participation</button>
      <button class="nav-btn" data-tab="leaderboard">Leaderboard</button>
    </nav>
  </header>

  <main>
    <section id="households" class="tab-panel active">
      <h2>Households</h2>
      <form id="householdForm" class="entity-form">
        <input type="hidden" name="id">
        <input name="name" placeholder="Household name" required>
        <input name="email" type="email" placeholder="Email" required>
        <input name="phone" placeholder="Phone" required>
        <input name="city" placeholder="City">
        <input name="address" placeholder="Address">
        <input name="numberOfMembers" type="number" min="1" max="50" value="1" placeholder="Members" required>
        <select name="status">
          <option value="ACTIVE">ACTIVE</option>
          <option value="INACTIVE">INACTIVE</option>
        </select>
        <button type="submit">Save</button>
        <button type="button" class="secondary" onclick="resetForm('householdForm')">Clear</button>
      </form>
      <div id="householdTable" class="table-wrap"></div>
    </section>

    <section id="activities" class="tab-panel">
      <h2>Log Activity</h2>
      <form id="activityForm" class="entity-form">
        <input type="hidden" name="id">
        <select name="householdId" class="household-select" required></select>
        <input name="logDate" type="date" required>
        <select name="activityType" id="activityTypeSelect" required></select>
        <input name="quantity" type="number" step="0.01" min="0.01" placeholder="Quantity" required>
        <input name="notes" placeholder="Notes (optional)">
        <button type="submit">Save</button>
        <button type="button" class="secondary" onclick="resetForm('activityForm')">Clear</button>
      </form>
      <div class="filter-row">
        <label>Show logs for
          <select id="activityFilter"></select>
        </label>
      </div>
      <div id="activityTable" class="table-wrap"></div>
    </section>

    <section id="footprint" class="tab-panel">
      <h2>Footprint</h2>
      <div class="filter-row">
        <select id="footprintHousehold" class="household-select"></select>
        <input type="month" id="footprintMonth">
        <button id="footprintBtn">Calculate</button>
      </div>
      <div id="footprintResult"></div>
      <h3>Last 6 months</h3>
      <div id="historyTable" class="table-wrap"></div>
      <h3>Emission factors</h3>
      <div id="factorTable" class="table-wrap"></div>
    </section>

    <section id="challenges" class="tab-panel">
      <h2>Challenges</h2>
      <form id="challengeForm" class="entity-form">
        <input type="hidden" name="id">
        <input name="title" placeholder="Title" required>
        <input name="description" placeholder="Description">
        <input name="targetReductionPercent" type="number" step="0.1" min="1" max="100" placeholder="Target %" required>
        <input name="startDate" type="date" required>
        <input name="endDate" type="date" required>
        <button type="submit">Save</button>
        <button type="button" class="secondary" onclick="resetForm('challengeForm')">Clear</button>
      </form>
      <div id="challengeTable" class="table-wrap"></div>
    </section>

    <section id="participation" class="tab-panel">
      <h2>Participation</h2>
      <form id="joinForm" class="entity-form">
        <select name="householdId" class="household-select" required></select>
        <select name="challengeId" id="joinChallenge" required></select>
        <button type="submit">Join challenge</button>
      </form>
      <div id="participationTable" class="table-wrap"></div>
    </section>

    <section id="leaderboard" class="tab-panel">
      <h2>Monthly Leaderboard</h2>
      <p class="hint">Ranked by % reduction versus each household's own previous month.</p>
      <div class="filter-row">
        <input type="month" id="leaderboardMonth">
        <button id="leaderboardBtn">Load</button>
      </div>
      <div id="leaderboardTable" class="table-wrap"></div>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
